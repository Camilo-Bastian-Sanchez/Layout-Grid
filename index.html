<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Ecommerce</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body >
    <div class="layout">
    <header class="header">
      <nav class="nav">
        <h1>Mi Ecommerce</h1>
      </nav>
    </header>
    <aside class="sidebar">
      <h2>Categorias</h2>
      <div class="category-list">
            <p>Perfumes(13)</p>
            <p>Ropa(21)</p>
            <p>Accesorios(41)</p>
            <p>Zapatos(10)</p>
      </div>
    </aside>

    <main class="main">

      <section class="recipe-grid">
        <article class="recipe-card">
          <img src="assets/img/Perfume Hombre.jpg" alt="" />
          <h3>Perfume Hombre</h3>
          <p>31.400</p>
          <span>Comprar</span>
        </article>
        <article class="recipe-card">
          <img src="assets/img/Perfume hombre 2.jpg" alt="" />
          <h3>Perfume Hombre</h3>
          <p>68.900</p>
          <span>Comprar</span>
        </article>
        <article class="recipe-card">
          <img src="assets/img/Zapatos Formales.jpg" alt="" />
          <h3>Zapatos Formales</h3>
          <p>29.700</p>
          <span>Comprar</span>
        </article>
        <article class="recipe-card">
          <img src="assets/img/Chaqueta de invierno.jpg" alt="" />
          <h3>Chaqueta de Invierno</h3>
          <p>44.700</p>
          <span>Comprar</span>
        </article>
      </section>
    </main>
    <footer class="footer">
        @miecommerce
    </footer>
    </div>
  </body>
</html>
